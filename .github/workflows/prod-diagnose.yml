name: Production diagnostics

# Read-only look at the production box when an endpoint misbehaves: the
# schema of the tables the site endpoints read, the /api/sites query run
# directly, and recent errors from the analyticshq services. Changes nothing.
#
# The repository and its Actions logs are public, so every line from the
# service journal has email addresses, bearer tokens and hashes redacted
# before it is printed.
on:
  workflow_dispatch:
    inputs:
      owner_id:
        description: User id to run the /api/sites query as
        required: true
        type: string
        default: '1'
      since:
        description: How far back to read service logs (journalctl --since)
        required: true
        type: string
        default: 30 min ago

jobs:
  diagnose:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
    steps:
      - name: Add deploy SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          [ -n "$DEPLOY_SSH_KEY" ] || { echo "::error::DEPLOY_SSH_KEY is not available"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Inspect
        env:
          OWNER_ID: ${{ inputs.owner_id }}
          SINCE: ${{ inputs.since }}
        run: |
          set -euo pipefail
          printf '%s' "$OWNER_ID" | grep -Eq '^[0-9]{1,12}$' || { echo "::error::owner_id must be a number"; exit 1; }
          printf '%s' "$SINCE" | grep -Eq '^[0-9A-Za-z :-]{1,40}$' || { echo "::error::bad since"; exit 1; }
          ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes root@analyticshq.org \
            "OWNER_ID=$OWNER_ID SINCE_B64=$(printf '%s' "$SINCE" | base64 -w0) bash -s" <<'REMOTE'
          set -uo pipefail
          SINCE=$(printf '%s' "$SINCE_B64" | base64 -d)
          redact() { sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/<email>/g; s/(Bearer|bearer)[ :]+[A-Za-z0-9._|~-]+/\1 <token>/g; s/\$2[aby]\$[0-9]{2}\$[.\/A-Za-z0-9]{53}/<hash>/g; s/(auth-token=)[^; ]+/\1<token>/g'; }
          PSQL_BIN=$(command -v psql || ls /usr/lib/postgresql/*/bin/psql 2>/dev/null | tail -n 1 || true)
          PSQL=(runuser -u postgres -- "$PSQL_BIN" -X -v ON_ERROR_STOP=0 -d analyticshq)

          echo "== columns of sites / site_members / users"
          "${PSQL[@]}" -c "SELECT table_name, string_agg(column_name || ':' || data_type, ', ' ORDER BY ordinal_position) FROM information_schema.columns WHERE table_name IN ('sites','site_members','users') AND table_schema = 'public' GROUP BY table_name"

          echo "== the /api/sites query, as user $OWNER_ID"
          "${PSQL[@]}" -v uid="$OWNER_ID" <<'SQL'
          SELECT s.id, s.name, s.domains, s.timezone, s.currency, s.is_active, s.created_at,
                 CASE WHEN s.owner_id = :'uid'::int THEN 'owner' ELSE m.role END AS role
          FROM sites s
          LEFT JOIN site_members m ON m.site_id = s.id AND m.user_id = :'uid'::int
          WHERE s.owner_id = :'uid'::int OR m.user_id IS NOT NULL
          ORDER BY s.created_at DESC;
          SQL

          echo "== analyticshq services"
          systemctl list-units --type=service --all --no-pager 2>/dev/null | grep -i analyticshq || echo "(no unit names matched analyticshq)"
          for u in $(systemctl list-units --type=service --all --no-legend --plain 2>/dev/null | awk '{print $1}' | grep -i analyticshq); do
            echo "== $u: errors since $SINCE"
            journalctl -u "$u" --since "$SINCE" --no-pager -o short-iso 2>/dev/null \
              | grep -iE -A4 'error|exception|fail|500|stack|at .*\.(ts|js):' | redact | tail -n 80
          done
          REMOTE
