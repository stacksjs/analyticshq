name: CI

on:
  push:
    branches:
      - main # deploys to prod

    tags:
      - '*-beta.*' # ensures it is deployed to stage in case `main`` is not pushed to

  pull_request:
    branches:
      - main # deploys to dev

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

# Authenticates the repo-tarball fetch `bun install` performs for the
# `github:stacksjs/ts-analytics` dep localtunnels pulls in. See deploy.yml.
env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  # Committed env files must never carry a plaintext secret.
  #
  # .gitignore deliberately un-ignores .env.production / .env.staging / .env.ci
  # (dotenvx encrypts them in place, so they are meant to be committed). That is a
  # correct setup with one failure mode: a value that never got encrypted looks
  # identical to one that did, and this repo is public. It has happened upstream --
  # stacksjs/stacks shipped three plaintext mailbox passwords in .env.production and
  # every scaffolded app inherited them.
  #
  # GitHub's secret scanning would not have caught it either: a mailbox password
  # matches no provider pattern. So this is the check that has to hold the line.
  #
  # Only key NAMES are printed on failure, never values.
  secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: No plaintext secrets in committed env files
        run: |
          st=0
          for f in $(git ls-files '.env*'); do
            # .env.example is documentation: non-secret defaults, no encryption expected.
            [ "$f" = ".env.example" ] && continue
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in ''|'#'*) continue ;; esac
              case "$line" in *=*) ;; *) continue ;; esac
              key=${line%%=*}
              val=${line#*=}
              val=${val%\"}
              val=${val#\"}
              # The dotenvx public key is public by design -- that is the point of it.
              case "$key" in DOTENV_PUBLIC_KEY*) continue ;; esac
              [ -z "$val" ] && continue
              case "$val" in encrypted:*) continue ;; esac
              echo "::error file=$f::$key is committed in plaintext. Encrypt it with dotenvx, or move it out of the repo into the deploy environment."
              st=1
            done < "$f"
          done
          if [ "$st" -eq 0 ]; then
            echo "All committed env values are empty, encrypted, or a public key."
          fi
          exit $st

  lint:
    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bun buddy lint

  typecheck:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install dependencies
        run: bun install

      - name: Typecheck
        run: bunx --bun tsc --noEmit

  test:
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
      contents: read
    strategy:
      matrix:
        os: [ubuntu-latest]
      fail-fast: false

    services:
      redis:
        image: redis:latest
        ports:
          - 6379:6379

      mysql:
        image: mysql:latest
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_db
          MYSQL_USER: user
          MYSQL_PASSWORD: password
        ports:
          - 3306:3306

      dynamodb:
        image: amazon/dynamodb-local
        ports:
          - 8000:8000

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install

      - name: Test Suite
        env:
          AWS_DYNAMODB_ENDPOINT: http://localhost:8000
        run: bun run test

  release-check:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    outputs:
      contains_release: ${{ steps.check_release.outputs.contains_release }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
      - name: Release Check
        id: check_release
        run: |
          if git log --format=%B -n 1 "${{ github.event.after }}" | grep -qi 'release'; then
            echo "contains_release=1" >> "$GITHUB_OUTPUT"
          else
            echo "contains_release=0" >> "$GITHUB_OUTPUT"
          fi

  deploy-prod:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-check.outputs.contains_release == '0'
    needs: [secrets, lint, typecheck, test, release-check]
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install

      # set the .env file
      - name: Ensure .env Set
        run: |
          cp .env.example .env

      - name: Check AWS Credentials
        id: aws-credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "AWS credentials are not configured; skipping production deploy."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        if: steps.aws-credentials.outputs.available == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: bun buddy deploy production --yes

  deploy-stage:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (startsWith(github.ref, 'refs/tags/') && contains(github.ref, '-beta.'))
    needs: [secrets, lint, typecheck, test]
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install

      - name: Ensure .env Set
        run: cp .env.example .env

      - name: Check AWS Credentials
        id: aws-credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "AWS credentials are not configured; skipping staging deploy."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        if: steps.aws-credentials.outputs.available == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: bun buddy deploy staging --yes

  deploy-dev:
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'pull_request' && github.base_ref == 'main')
    needs: [secrets, lint, typecheck, test]
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install

      - name: Ensure .env Set
        run: cp .env.example .env

      - name: Check AWS Credentials
        id: aws-credentials
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$AWS_SECRET_ACCESS_KEY" ]; then
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "AWS credentials are not configured; skipping development deploy."
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy
        if: steps.aws-credentials.outputs.available == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: bun buddy deploy development --yes

  publish-commit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Use cached node_modules
        uses: actions/cache@v5
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('**/bun.lock') }}
          restore-keys: |
            node-modules-

      - name: Install Dependencies
        run: bun install

      - name: Build
        run: bun run build

      - name: Publish Commit
        run: ./storage/framework/scripts/publish-commit
