name: Owner access

# Recover sign-in for a site's OWNER in production: set a fresh random password
# on the account that owns the site, prove it works end to end against the live
# app, and hand the credentials back ENCRYPTED.
#
# This repository is public, and so are its Actions logs. So nothing sensitive
# is ever printed: the password, the owner's email, the bcrypt hash and the
# session token are all masked the moment they exist, and the credentials leave
# the runner only as RSA-OAEP ciphertext for the public key the caller passed
# in. Only whoever holds the matching private key can read them.
#
# Produce a key and read the result:
#   openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out owner.key
#   openssl pkey -in owner.key -pubout -outform DER | base64 -w0   # -> public_key input
#   echo '<ciphertext from the log>' | base64 -d | \
#     openssl pkeyutl -decrypt -inkey owner.key -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256
#
# It replaces the owner's password. It runs under the same `production`
# environment and DEPLOY_SSH_KEY the deploy uses, so it grants nothing the
# deploy did not already hold.
on:
  workflow_dispatch:
    inputs:
      site_id:
        description: Site id (the data-site value in the tracking snippet)
        required: true
        type: string
      public_key:
        description: Base64 DER (SPKI) RSA public key the credentials are encrypted to
        required: true
        type: string

concurrency:
  group: owner-access
  cancel-in-progress: false

jobs:
  reset-and-verify:
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      contents: read
    env:
      HOST: analyticshq.org
      ORIGIN: https://analyticshq.org
    steps:
      - name: Validate inputs
        env:
          SITE_ID: ${{ inputs.site_id }}
          PUBLIC_KEY: ${{ inputs.public_key }}
        run: |
          set -euo pipefail
          printf '%s' "$SITE_ID" | grep -Eq '^[A-Za-z0-9_-]{1,64}$' || { echo "::error::bad site_id"; exit 1; }
          printf '%s' "$PUBLIC_KEY" | base64 -d > "$RUNNER_TEMP/pub.der"
          openssl pkey -pubin -inform DER -in "$RUNNER_TEMP/pub.der" -noout -text | head -n 1

      - uses: oven-sh/setup-bun@v2

      - name: Add deploy SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          [ -n "$DEPLOY_SSH_KEY" ] || { echo "::error::DEPLOY_SSH_KEY is not available"; exit 1; }
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Set a new password on the site owner
        env:
          SITE_ID: ${{ inputs.site_id }}
        run: |
          set -euo pipefail
          # Runs one psql statement on the box as the postgres superuser. The SQL
          # and every value travel base64-encoded in the environment, so nothing
          # (a `$` in a bcrypt hash included) is reinterpreted by a shell on the
          # way, and values are bound as psql variables, never spliced into SQL.
          # stdin carries the remote script itself.
          remote_psql() {
            local sql_b64 site_b64
            sql_b64=$(printf '%s' "$1" | base64 -w0)
            site_b64=$(printf '%s' "$SITE_ID" | base64 -w0)
            ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes "root@${HOST}" \
              "SQL_B64=$sql_b64 SITE_B64=$site_b64 HASH_B64=${HASH_B64:-} UID_B64=${UID_B64:-} bash -s" <<'REMOTE'
          set -euo pipefail
          PSQL_BIN=$(command -v psql || ls /usr/lib/postgresql/*/bin/psql 2>/dev/null | tail -n 1 || true)
          [ -n "$PSQL_BIN" ] || { echo "no psql on the box" >&2; exit 1; }
          d() { printf '%s' "${1:-}" | base64 -d; }
          d "$SQL_B64" | runuser -u postgres -- "$PSQL_BIN" -X -qAt -v ON_ERROR_STOP=1 -d analyticshq \
            -v site="$(d "$SITE_B64")" -v hash="$(d "$HASH_B64")" -v uid="$(d "$UID_B64")"
          REMOTE
          }

          # 1. Who owns the site. Masked before anything could echo it.
          owner=$(remote_psql "SELECT u.id || '|' || coalesce(u.email, '') FROM sites s JOIN users u ON u.id = s.owner_id WHERE s.id = :'site';")
          if [ -z "$owner" ]; then
            echo "::error::Site $SITE_ID has no owner account (sites.owner_id is empty or points at no user). Nothing was changed."
            exit 1
          fi
          uid=${owner%%|*}
          email=${owner#*|}
          [ -n "$email" ] && echo "::add-mask::$email"
          [ -n "$email" ] || { echo "::error::The owner account has no email to sign in with. Nothing was changed."; exit 1; }
          echo "Owner account id: $uid"

          # 2. A fresh password, masked, and its bcrypt hash in the format the
          # app's verifyHash reads ($2b$, cost 12, what the framework makes).
          password=$(openssl rand -base64 48 | tr -dc 'A-Za-z0-9' | cut -c1-28)
          echo "::add-mask::$password"
          hash=$(PW="$password" bun -e 'console.log(await Bun.password.hash(process.env.PW, { algorithm: "bcrypt", cost: 12 }))')
          echo "::add-mask::$hash"

          # 3. Write it. Exactly this user, or fail.
          changed=$(HASH_B64=$(printf '%s' "$hash" | base64 -w0) UID_B64=$(printf '%s' "$uid" | base64 -w0) \
            remote_psql "UPDATE users SET password = :'hash', updated_at = now() WHERE id = :'uid'::bigint RETURNING id;")
          [ "$changed" = "$uid" ] || { echo "::error::Password was not updated."; exit 1; }
          echo "Password replaced for owner account $uid."

          # Hand the secrets to later steps through a private file. Step outputs
          # would not do: Actions drops any output containing a masked value.
          umask 077
          printf '%s\n%s\n' "$email" "$password" > "$RUNNER_TEMP/owner-creds"

      - name: Sign in and check the site end to end
        env:
          SITE_ID: ${{ inputs.site_id }}
        run: |
          set -euo pipefail
          EMAIL=$(sed -n 1p "$RUNNER_TEMP/owner-creds")
          PASSWORD=$(sed -n 2p "$RUNNER_TEMP/owner-creds")
          echo "::add-mask::$EMAIL"
          echo "::add-mask::$PASSWORD"
          login_email=$(printf '%s' "$EMAIL" | tr '[:upper:]' '[:lower:]')

          # Sign in exactly as the login page does.
          body=$(jq -n --arg e "$login_email" --arg p "$PASSWORD" '{email: $e, password: $p}')
          resp=$(curl -sS --max-time 30 -X POST "$ORIGIN/login" -H 'content-type: application/json' -H 'accept: application/json' -d "$body" -w '\n%{http_code}')
          code=$(printf '%s' "$resp" | tail -n 1)
          json=$(printf '%s' "$resp" | sed '$d')
          token=$(printf '%s' "$json" | jq -r '.access_token // .token // empty' 2>/dev/null || true)
          [ -n "$token" ] && echo "::add-mask::$token"
          echo "POST /login -> HTTP $code"
          if printf '%s' "$json" | jq -e '.requires_two_factor == true' >/dev/null 2>&1; then
            echo "::warning::Password accepted; this account also has 2FA, so a TOTP code is needed to finish signing in."
            exit 0
          fi
          [ -n "$token" ] || { echo "::error::Sign-in failed: $(printf '%s' "$json" | jq -c 'del(.token, .access_token)' 2>/dev/null || echo '(non-JSON response)')"; exit 1; }

          # The site is listed for this account, as its owner.
          role=$(curl -fsS --max-time 30 "$ORIGIN/api/sites" -H "authorization: Bearer $token" | jq -r --arg s "$SITE_ID" '.sites[] | select(.id == $s) | .role')
          echo "GET /api/sites -> role on $SITE_ID: ${role:-none}"
          [ "$role" = "owner" ] || { echo "::error::Signed in, but this account is not the site's owner."; exit 1; }

          # The cities report answers for this account (counts only, never the rows).
          cities=$(curl -sS --max-time 30 "$ORIGIN/api/sites/$SITE_ID/cities" -H "authorization: Bearer $token" -w '\n%{http_code}')
          echo "GET /api/sites/$SITE_ID/cities -> HTTP $(printf '%s' "$cities" | tail -n 1), $(printf '%s' "$cities" | sed '$d' | jq '.cities | length' 2>/dev/null || echo '?') row(s)"

          # The dashboard, signed in by cookie the way a browser is: the owner-only
          # "Record cities" control is there, and so is the Top cities panel,
          # which renders only when the site has city_geo on.
          page=$(curl -fsS --max-time 60 "$ORIGIN/dashboard?site=$SITE_ID" -H "cookie: auth-token=$token")
          for want in 'Record cities' 'Top cities'; do
            if printf '%s' "$page" | grep -q "$want"; then echo "dashboard: found \"$want\""; else echo "::error::dashboard: \"$want\" missing"; missing=1; fi
          done
          [ -z "${missing:-}" ]

      - name: Encrypt the credentials for the caller
        if: always()
        run: |
          set -euo pipefail
          # Runs even if the sign-in check failed: the password HAS been
          # replaced by then, so the caller must still get it.
          [ -f "$RUNNER_TEMP/owner-creds" ] || { echo "No password was set, nothing to hand back."; exit 0; }
          EMAIL=$(sed -n 1p "$RUNNER_TEMP/owner-creds")
          PASSWORD=$(sed -n 2p "$RUNNER_TEMP/owner-creds")
          echo "::add-mask::$EMAIL"
          echo "::add-mask::$PASSWORD"
          ct=$(printf 'email: %s\npassword: %s\n' "$EMAIL" "$PASSWORD" \
            | openssl pkeyutl -encrypt -pubin -keyform DER -inkey "$RUNNER_TEMP/pub.der" \
                -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 | base64 -w0)
          echo "CIPHERTEXT-BEGIN $ct CIPHERTEXT-END"
